<!doctype html>
<html lang="$lang">

<style>

@font-face { font-family: 'Mont'; font-weight: 800; src: url('Montserrat-ExtraBold.ttf'); }
body { margin: 0; background: #000; }
#root { width: 1080px; height: 1920px; position: relative; overflow: hidden; background: #000; color: #fff; font-family: 'Mont', sans-serif; }
.scene { position: absolute; inset: 0; }

.friend .who { font-weight: 900; font-size: 58px; }
.friend .who i { display: inline-block; width: 26px; height: 26px; background: #FFE500; margin-right: 24px; vertical-align: 6px; font-style: normal; }
.friend .up { font-family: 'Anton', sans-serif; font-size: 96px; color: #FFE500; }
.step { position: absolute; left: 90px; right: 90px; height: 150px; border: 3px solid #333; background: #0b0b0b; font-weight: 900; font-size: 48px; display: flex; align-items: center; padding: 0 40px; box-sizing: border-box; }

.mark { position: absolute; top: 214px; left: 0; right: 0; text-align: center; font-family: 'Anton', sans-serif; font-size: 64px; letter-spacing: 1px; }

</style>
</head>
<body>

<script src="gsap.min.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
// 1: the hook, already on screen at the first frame
tl.fromTo('#f1a', { scale: 1.18 }, { scale: 1, duration: 0.45, ease: 'power4.out' }, 0);

tl.fromTo('#f3a', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out' }, 8.65);
tl.fromTo('#f3n', { scale: 0.6 }, { scale: 1, duration: 0.5, ease: 'back.out(2)' }, 8.8);

tl.to(['#f3a', '#f3n', '#f3b'], { y: -1700, duration: 0.35, ease: 'power3.in', stagger: 0.03 }, 11.85);
// 4: invites go out in batches, in line order
tl.fromTo('#f4a', { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power4.out' }, 12.2);
tl.fromTo('#f4b', { clipPath: 'inset(-30% 100% -10% 0)' }, { clipPath: 'inset(-30% 0% -10% 0)', duration: 0.4, ease: 'expo.out' }, 12.35);
tl.fromTo(['#k1', '#k2', '#k3'], { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.3, ease: 'power3.out', stagger: 0.5 }, 12.8);
tl.to(['#k1', '#k2', '#k3'], { borderColor: '#FFE500', duration: 0.15, stagger: 0.5 }, 13.0);
tl.fromTo('#f4frame', { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: 'power3.out' }, 14.2);
tl.fromTo('#f4img', { x: -90, y: -120 }, { x: -170, y: -260, duration: 1.8, ease: 'none' }, 14.2);

// 5: the call to action, ending on a clean frame

tl.fromTo('#f5a', { y: 140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: 'power4.out' }, 16.3);

window.__timelines.main = tl;
</script>
